name: Import public source package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract approved archive
        run: |
          echo "6edf2af3de2df93bb8ffd6d5e8abb8b3188249eba077cfcfbaba5512b87eb985  HPSM-codigo-publico-rascunho.zip" | sha256sum -c -
          unzip -oq HPSM-codigo-publico-rascunho.zip
          rm HPSM-codigo-publico-rascunho.zip
      - name: Commit browsable source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish browsable source tree"
          git push
